name: CI

# Os mesmos gates do CLAUDE.md (seção 6). Nenhum job chama provedor de LLM,
# então não gasta crédito: os testes substituem as chamadas externas.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (py_compile + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # Só o necessário para os testes (sem torch/whisper nem SDKs de LLM).
      - run: pip install -r requirements-test.txt

      - name: py_compile
        run: python -m compileall -q backend

      - name: pytest
        run: python -m pytest

  frontend:
    name: Frontend (lint + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-next
    env:
      # Valores fictícios: o build só precisa que existam (o cliente Supabase
      # exige URL e chave ao carregar). Nenhuma requisição é feita no build.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_SECRET: ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: tsc
        run: npx tsc --noEmit

      - name: build
        run: npm run build
